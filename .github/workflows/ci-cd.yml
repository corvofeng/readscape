name: CI/CD

# 触发：向 main 推送、向 main 的 PR、以及 v* 版本标签；也可手动运行。
# dist 分支只在打 v* 标签时更新；dist 分支的推送不会匹配下面的分支过滤，不会递归触发。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 需要写入 dist 分支与创建 Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建 + 语法检查 + 测试
        run: npm run check
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: userscripts
          path: dist/*.user.js
          if-no-files-found: error

  publish:
    name: 发布到 dist 分支
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: readscape-dist-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci

      # 1) 构建「含 token」版本，发布到 dist 分支作为油猴自动更新源。
      #    READSCAPE_UPDATE_TOKEN 必须是长期有效、只读(contents:read)的 fine-grained PAT，
      #    油猴用它在不带凭证的情况下拉取私有仓库的 raw 文件。未配置时降级为不含 token。
      - name: 构建自动更新产物 (dist 分支)
        env:
          READSCAPE_UPDATE_TOKEN: ${{ secrets.READSCAPE_UPDATE_TOKEN }}
        run: |
          npm run build
          if [ -z "$READSCAPE_UPDATE_TOKEN" ]; then
            echo "::warning::未配置 secrets.READSCAPE_UPDATE_TOKEN，dist 分支产物不含 token，私有仓库将无法自动更新。"
          fi
      - name: 构建固定版本 (禁用自动更新)
        run: npm run build -- --fixed

      - name: 检出独立产物分支
        uses: actions/checkout@v4
        with:
          ref: dist
          path: .publish

      - name: 保留版本目录并发布到 dist 分支
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/publish-dist.mjs .publish dist "$RELEASE_TAG"
          cd .publish
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "chore(dist): publish $RELEASE_TAG [skip ci]"
            git push origin HEAD:dist
          fi

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.ref_name }}/*.user.js
          generate_release_notes: true

      # 3) 同步到博客 R2 镜像（rawforcorvofeng.cn 的 blog 桶，独立前缀 readscape/）。
      #    最新产物的更新基址改指镜像域名，从镜像安装后检查更新同样不依赖 GitHub。
      #    未配置 R2 secrets 时跳过，不阻塞发布。需在仓库 secrets 里添加
      #    R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT / R2_BUCKET（值见 ~/.env.r2-blog）。
      - name: 同步产物到博客 R2 镜像
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REGION: auto
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::warning::未配置 R2 镜像 secrets（R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_ENDPOINT/R2_BUCKET），跳过 rawforcorvofeng.cn 同步。"
            exit 0
          fi
          READSCAPE_UPDATE_BASE="${R2_PUBLIC_BASE:-https://rawforcorvofeng.cn}/readscape" npm run build
          node scripts/publish-r2.mjs --with-archive --check
