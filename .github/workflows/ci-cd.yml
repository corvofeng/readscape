name: CI/CD

# 触发：向 main 推送、向 main 的 PR、以及 v* 版本标签；也可手动运行。
# dist 分支只在打 v* 标签时更新；dist 分支的推送不会匹配下面的分支过滤，不会递归触发。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 需要写入 dist 分支与创建 Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建 + 语法检查 + 测试
        run: npm run check
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: userscripts
          path: dist/*.user.js
          if-no-files-found: error

  publish:
    name: 发布到 dist 分支
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci

      # 1) 构建「含 token」版本，发布到 dist 分支作为油猴自动更新源。
      #    READSCAPE_UPDATE_TOKEN 必须是长期有效、只读(contents:read)的 fine-grained PAT，
      #    油猴用它在不带凭证的情况下拉取私有仓库的 raw 文件。未配置时降级为不含 token。
      - name: 构建自动更新产物 (dist 分支)
        env:
          READSCAPE_UPDATE_TOKEN: ${{ secrets.READSCAPE_UPDATE_TOKEN }}
        run: |
          npm run build
          if [ -z "$READSCAPE_UPDATE_TOKEN" ]; then
            echo "::warning::未配置 secrets.READSCAPE_UPDATE_TOKEN，dist 分支产物不含 token，私有仓库将无法自动更新。"
          fi
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp dist/*.user.js /tmp/publish/

      - name: 推送到 dist 分支 (orphan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/publish
          git init -q
          git checkout -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(dist): build ${GITHUB_SHA::7} [skip ci]" || echo "无变化，跳过提交"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist

      # 2) 构建「不含 token」版本用于 GitHub Release 资产，避免在可下载资产中泄露 token。
      - name: 构建 Release 产物 (无 token)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          unset READSCAPE_UPDATE_TOKEN
          npm run build

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.user.js
          generate_release_notes: true
